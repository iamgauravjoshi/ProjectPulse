services:
  db:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-projectpulse}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - projectpulse_pgdata:${POSTGRES_DATA_TARGET:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  projectpulse_pgdata:
    name: ${POSTGRES_DATA_VOLUME:-projectpulse_pgdata}
    external: ${POSTGRES_DATA_VOLUME_EXTERNAL:-false}
